name: Integration Tests (Home Assistant Preview)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  integration-tests-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements-test.txt
          HA_PREVIEW_VERSION="$(python - <<'PY'
          import json
          import urllib.request
          from packaging.version import Version

          with urllib.request.urlopen("https://pypi.org/pypi/homeassistant/json") as response:
              releases = json.load(response)["releases"]

          preview_versions = [
              Version(version)
              for version, files in releases.items()
              if files and Version(version).is_prerelease
          ]
          print(max(preview_versions))
          PY
          )"
          pip install --upgrade --pre -c <(printf 'homeassistant==%s\n' "${HA_PREVIEW_VERSION}") "homeassistant==${HA_PREVIEW_VERSION}" "pytest-homeassistant-custom-component~=0.13.0"
      - name: Run integration tests
        run: python -m pytest custom_components/desired_state/tests/ -q
