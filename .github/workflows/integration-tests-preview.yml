name: Integration Tests (Home Assistant Preview)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  integration-tests-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          HA_PREVIEW_VERSION="$(python - <<'PY'
          import json
          import urllib.request
          from packaging.version import Version
           
          with urllib.request.urlopen("https://pypi.org/pypi/homeassistant/json") as response:
              releases = json.load(response)["releases"]
           
          preview_versions = [
              Version(version)
              for version, files in releases.items()
              if files and Version(version).is_prerelease
          ]
          print(max(preview_versions))
          PY
          )"
          pip install --upgrade "homeassistant==${HA_PREVIEW_VERSION}" pytest-homeassistant-custom-component
      - name: Run integration tests
        run: python -m pytest custom_components/desired_state/tests/ -q
