name: Integration Tests (Home Assistant Preview)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  integration-tests-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements-test.txt
          read -r HA_PREVIEW_VERSION PYTEST_HA_VERSION <<<"$(python .github/scripts/select_test_versions.py preview 3.14)"
          pip install --upgrade --pre "homeassistant==${HA_PREVIEW_VERSION}" "pytest-homeassistant-custom-component==${PYTEST_HA_VERSION}"
      - name: Run integration tests
        run: python -m pytest custom_components/desired_state/tests/ -q
