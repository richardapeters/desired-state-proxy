name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements-test.txt
          read -r HA_STABLE_VERSION PYTEST_HA_VERSION <<<"$(python .github/scripts/select_test_versions.py stable 3.14)"
          pip install --upgrade "homeassistant==${HA_STABLE_VERSION}" "pytest-homeassistant-custom-component==${PYTEST_HA_VERSION}"
      - name: Run integration tests
        run: python -m pytest custom_components/desired_state/tests/ -q
