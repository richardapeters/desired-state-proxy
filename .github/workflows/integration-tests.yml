name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements-test.txt
          HA_STABLE_VERSION="$(python - <<'PY'
          import json
          import sys
          import urllib.request
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version
 
          with urllib.request.urlopen("https://pypi.org/pypi/homeassistant/json") as response:
              releases = json.load(response)["releases"]

          python_version = Version(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")

          def is_python_compatible(files):
              for file in files:
                  requires_python = file.get("requires_python")
                  if not requires_python or python_version in SpecifierSet(requires_python):
                      return True
              return False

          stable_ha_versions = sorted(
              (
                  Version(version)
                  for version, files in releases.items()
                  if files and is_python_compatible(files) and not Version(version).is_prerelease
              ),
              reverse=True,
          )
          if not stable_ha_versions:
              raise RuntimeError("No stable Home Assistant release available for this Python version")
          print(stable_ha_versions[0])
          PY
          )"
          pip install --upgrade -c <(printf 'homeassistant==%s\n' "${HA_STABLE_VERSION}") "homeassistant==${HA_STABLE_VERSION}" "pytest-homeassistant-custom-component~=0.13.0"
      - name: Run integration tests
        run: python -m pytest custom_components/desired_state/tests/ -q
