version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      non-major-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      non-major-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
